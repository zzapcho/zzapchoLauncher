[package]
name = "zzapcho-launcher"
version = "0.1.0"
description = "A compact custom Minecraft launcher"
authors = ["zzapcho"]
edition = "2021"

[lib]
name = "zzapcho_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
